name: Sync and deploy backend to Google Apps Script (PRODUCTION)

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Push source only, or explicitly deploy the production web app."
        required: true
        type: choice
        options:
          - push_only
          - push_and_deploy
        default: push_only
      confirm_production_action:
        description: "Confirm that this action targets the isolated production Apps Script project and database."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apps-script-production-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production_action == true && (inputs.phase == 'push_only' || (inputs.phase == 'push_and_deploy' && vars.ALLOW_APPS_SCRIPT_DEPLOY == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm isolated production targets
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          REQUESTED_PHASE: ${{ inputs.phase }}
          ALLOW_APPS_SCRIPT_DEPLOY: ${{ vars.ALLOW_APPS_SCRIPT_DEPLOY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCRIPT_ID" || (echo "Missing production secret APPS_SCRIPT_ID." && exit 1)
          if [ "$REQUESTED_PHASE" = "push_and_deploy" ]; then
            test "$ALLOW_APPS_SCRIPT_DEPLOY" = "true" || (echo "Production deployment is disabled. Set repository variable ALLOW_APPS_SCRIPT_DEPLOY=true only after production checks." && exit 1)
            test -n "$DEPLOYMENT_ID" || (echo "Missing production secret APPS_SCRIPT_DEPLOYMENT_ID." && exit 1)
            if [ "$DEPLOYMENT_ID" = "AKfycbzHlLF_UuVZu6VIbl59EyIi4ZnLeJfssrBmo0jkn4BvrCPpqYyJ5qP71WdALtyalOKv_A" ] || [ "$DEPLOYMENT_ID" = "AKfycbw-o15vVNFbnfqhVYV6PtpDOTt4jURF5QKEahvnENkZp2hOPlek1Hj55T2tBnypfPCb" ]; then
              echo "Refusing deployment: configured deployment ID belongs to an existing environment."
              exit 1
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate backend source and manifest
        shell: bash
        run: |
          set -euo pipefail
          test -f appsscript.json
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'));"
          count=0
          declare -A names=()
          for file in *.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            name="${file%.js}"
            name="${name%.gs}"
            if [[ -n "${names[$name]+x}" ]]; then
              echo "Duplicate Apps Script target name: $name.gs"
              exit 1
            fi
            names["$name"]=1
            count=$((count + 1))
          done
          test "$count" -ge 60 || (echo "Refusing sync: expected at least 60 source files, found $count." && exit 1)
          echo "Validated $count source files."

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLASP_CREDENTIALS" || (echo "Missing CLASP_CREDENTIALS secret." && exit 1)
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const file = path.join(process.env.HOME, '.clasprc.json');
          let parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (typeof parsed === 'string') parsed = JSON.parse(parsed);
          if (parsed && parsed.token && parsed.token.access_token &&
              !parsed.oauth2ClientSettings && !parsed.tokens) {
            parsed = Object.assign({}, parsed.token, {
              exprity_date: parsed.token.exprity_date || parsed.token.expiry_date
            });
          }
          if (parsed && parsed.access_token && !parsed.tokens) {
            parsed.exprity_date = parsed.exprity_date || parsed.expiry_date;
          }
          if (parsed && parsed.tokens && !parsed.tokens.default) {
            const named = Object.entries(parsed.tokens).filter(([, value]) => value);
            if (named.length === 1) parsed.tokens.default = named[0][1];
          }
          const hasV3 = parsed && parsed.tokens && parsed.tokens.default;
          const hasLegacyLocal = parsed && parsed.token && parsed.token.access_token &&
            parsed.oauth2ClientSettings && parsed.oauth2ClientSettings.clientId &&
            parsed.oauth2ClientSettings.clientSecret;
          const hasLegacyGlobal = parsed && parsed.access_token && parsed.refresh_token;
          if (!hasV3 && !hasLegacyLocal && !hasLegacyGlobal) {
            throw new Error('CLASP_CREDENTIALS is not a supported clasp credential file.');
          }
          fs.writeFileSync(file, JSON.stringify(parsed), { mode: 0o600 });
          NODE

      - name: Prepare isolated Apps Script source
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy
          cp appsscript.json deploy/appsscript.json
          for file in *.js; do
            [ -f "$file" ] || continue
            name="${file%.js}"
            name="${name%.gs}"
            cp "$file" "deploy/$name.gs"
          done
          test "$(find deploy -maxdepth 1 -type f -name '*.gs' | wc -l)" -ge 60
          printf '{"scriptId":"%s","rootDir":"deploy"}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push validated source to isolated production Apps Script
        run: clasp push --force

      - name: Deploy isolated production web app
        if: ${{ inputs.phase == 'push_and_deploy' && vars.ALLOW_APPS_SCRIPT_DEPLOY == 'true' }}
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_ID"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "Production deployment ${GITHUB_SHA:0:7}"
